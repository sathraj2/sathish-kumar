services:
  postgres:
    image: postgres:16
    container_name: meetmind-postgres
    environment:
      POSTGRES_DB: meetmind
      POSTGRES_USER: meetmind
      POSTGRES_PASSWORD: meetmind_dev
    ports: ["5432:5432"]
    volumes: ["meetmind_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U meetmind -d meetmind"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: meetmind-redis
    ports: ["6379:6379"]
volumes:
  meetmind_pg:
