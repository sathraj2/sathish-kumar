name: build
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - run: dotnet restore src/MeetMindAI.Api/MeetMindAI.Api.csproj
      - run: dotnet build src/MeetMindAI.Api/MeetMindAI.Api.csproj --no-restore --configuration Release
